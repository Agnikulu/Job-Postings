name: ATS Sniper

on:
  schedule:
    # Hourly. GitHub Actions free-tier crons are best-effort and typically
    # run with ~5-20 min jitter (sometimes more during platform peaks).
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      reset_state:
        description: Clear archive/seen/stats and rebuild README from scratch
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ats-sniper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Detail-page caches live in the Actions cache, not git: they are
      # several MB and change every run. Each run saves under its own key and
      # restores the newest one.
      - name: Restore detail caches
        uses: actions/cache/restore@v4
        with:
          path: |
            apple_description_cache.json
            meta_title_cache.json
            meta_careers_state.json
          key: detail-caches-${{ github.run_id }}
          restore-keys: detail-caches-

      - name: Run scraper
        # Below the job timeout so the cache-save step still gets to run.
        timeout-minutes: 55
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASS: ${{ secrets.EMAIL_SMTP_PASS }}
          PYTHONUNBUFFERED: "1"
          ATS_SNIPER_FETCH_WORKERS: "8"
          # Slower pacing reduces 429 retry storms (often net faster than 0.75s/6s).
          ATS_SNIPER_LINKEDIN_DELAY_SEC: "10"
          ATS_SNIPER_LINKEDIN_PAGE_DELAY_SEC: "1.0"
          ATS_SNIPER_RESET_STATE: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_state && '1' || '' }}
          # Keep hourly runs inside the job budget (Google can return ~4k jobs at 200 pages).
          ATS_SNIPER_MAX_LIST_PAGES: "100"
          ATS_SNIPER_MAX_JOBS_PER_COMPANY: "2000"
        run: python scraper.py

      - name: Save detail caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            apple_description_cache.json
            meta_title_cache.json
            meta_careers_state.json
          key: detail-caches-${{ github.run_id }}

      - name: Commit updated state
        run: |
          git config user.name "ats-sniper-bot"
          git config user.email "ats-sniper-bot@users.noreply.github.com"
          git fetch origin main
          git add seen_jobs.json company_stats.json jobs_archive.json latest_jobs.md README.md
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update state files [skip ci]"
            # Rebase onto latest main if a human push landed during the long scrape.
            git pull --rebase origin main
            git push origin main
          fi
